# Browser and test settings
browser=chrome
headless=false
# Set to localhost:9222 to attach to an existing Chrome remote-debug session; leave blank for a fresh driver
chrome.debug.address=localhost:9222
URL="https://login-etan-dev11-saasfademo1.ds-fa.oraclepdemos.com/oam/server/"
# Set to true only for environments with self-signed TLS certificates
api.relaxed.https=false
# Report configuration
report.name=CoreApp

# ── Accessibility (Pa11y) ────────────────────────────────────────────────────
# Chrome's DevTools endpoint for the scan. Left blank, the scanner falls back to
# chrome.debug.address above, and then to the port ChromeDriver reports for the
# browser it launched itself.
pa11y.chrome.url=
# The Node scanner that ships with the pa11y-runner library. Must be the folder
# containing node_modules (i.e. `npm ci` has been run there).
pa11y.scanner.dir=h:/repos/pa11yRunner/scanner
# WCAG2A | WCAG2AA | WCAG2AAA
pa11y.standard=WCAG2AA
# Count warnings alongside errors when a scan is asked to pass
pa11y.include.warnings=false
# Narrow every scan to one container, e.g. #main — blank scans the whole page
pa11y.root.element=
# Comma-separated Pa11y rule codes to ignore on every page
pa11y.ignore=
# Milliseconds to settle after the page is handed over, for late-rendered content
pa11y.wait.after.load=500
